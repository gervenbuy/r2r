  .hero h1 span{color:var(--miso);}
  .hero p{font-size:15px; line-height:1.8; color:rgba(244,234,217,0.72); max-width:520px;}

  /* ---------- category chips ---------- */

  }
  .chip{

  /* ---------- grid ---------- */

    max-width:960px; margin:28px auto 80px; padding:0 20px;

  .card{
    background:var(--paper); color:var(--ink); border-radius:4px;

  .card:hover{transform:translateY(-4px); box-shadow:0 14px 26px rgba(0,0,0,0.35);}
  .card::before{
    content:"";

  .card .cat{

  .card .cover{

  .pf-instagram{--pf:#d6249f;}
  .pf-youtube{--pf:#e62117;}
  .pf-facebook{--pf:#1877f2;}
  .pf-tiktok, .pf-douyin{--pf:#25f4ee;}

  /* ---------- embeds ---------- */
  .embed{margin:6px 0 12px; border-radius:6px; overflow:hidden; background:var(--char-2);}
  .embed iframe{display:block; width:100%; border:0;}
  .embed.wide iframe{aspect-ratio:16/9;}
  .embed.tall{max-width:340px; margin-left:auto; margin-right:auto;}
  .embed.tall iframe{aspect-ratio:9/16;}

  /* ---------- share ---------- */
  .share-row{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 6px;}
  .share-row button, .share-row a{
    background:transparent; border:1px solid rgba(34,29,24,0.25); color:var(--ink);
    border-radius:999px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer;
    text-decoration:none; font-family:"Noto Sans TC";
  }
  .share-row button:hover, .share-row a:hover{border-color:var(--miso-deep); color:var(--miso-deep);}
  .share-row .line{background:#06c755; border-color:#06c755; color:#fff;}
  .share-row .line:hover{color:#fff; opacity:.9;}
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--paper); color:var(--ink); padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:all .2s; z-index:200;

  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:520px){
    header.top{padding:12px 16px;}
    .brand .tag{display:none;}

    .hero{padding:36px 16px 22px;}
    .search-wrap, .chip-row, .grid{padding:0 16px;}
    .sheet{padding:32px 20px 24px;}
  }
</style>

<script>
const SHEET_ID = "1NsPAms5h1ldxKs-ouUt22VB0LdkkZiskhsbklgxFsx0";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;
const SHEET_EDIT_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvx4grbGUudHP8nh6l5iRGL5eMmE4sXzIw9rMkBufaiYULZj70RFVOa250O79rfCgn/exec";

const seedRecipes = [
  {
    id: "cream-mushroom-udon",
    name: "奶油蘑菇烏龍麵",
    category: "麵食",
    preview: "金黃蘑菇炒香，拌入濃郁白味噌奶醬，烏龍麵吸滿湯汁，簡單卻療癒。",
    source: "https://www.instagram.com/reel/Db5tKoyMHRp/?igsi=bG5tdjQ5c2VkODNh",
    credit: "Evan & Nic",
    ingredients: [

      "玉米粉 1 湯匙 ＋ 水 1 湯匙（勾芡用）",
      "胡椒粉 適量",
      "烏龍麵 1–2 包",
      "白味噌 1.5 湯匙（可代替鹽）"
    ],
    steps: [
      "蘑菇下鍋炒至金黃色，加入奶油、醬油、洋蔥與蒜頭一起爆香。",
      "倒入牛奶，加入白味噌（或鹽）、胡椒粉調味。",
      "加入玉米粉水勾芡，煮至醬汁變濃稠。",
      "放入烏龍麵，拌勻至每條麵條都沾滿醬汁。",
      "起鍋前可加一顆蛋黃拌入麵中，讓口感更綿密濃郁（不加也可以）。完成，慢慢享用！"
    ]
  }
];

const SITE_URL = "https://gervenbuy.github.io/r2r/";

const PLATFORMS = {
  instagram: { label: "Instagram", short: "IG" },
  youtube:   { label: "YouTube",   short: "YouTube" },
  facebook:  { label: "Facebook",  short: "FB" },
  tiktok:    { label: "TikTok",    short: "TikTok" },
  douyin:    { label: "抖音",      short: "抖音" },
  other:     { label: "原始網站",  short: "連結" }
};

function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function safeUrl(u){
  u = (u || "").trim();
  return /^https?:\/\//i.test(u) ? u : "";
}

function cssUrl(u){
  return u.replace(/[\s"'()\\]/g, c => "%" + c.charCodeAt(0).toString(16).padStart(2, "0"));
}

function detectPlatform(url){
  let host = "";
  try { host = new URL(url).hostname.toLowerCase(); } catch(e){ return null; }
  if(/(^|\.)instagram\.com$/.test(host)) return "instagram";
  if(/(^|\.)(youtube\.com|youtu\.be)$/.test(host)) return "youtube";
  if(/(^|\.)(facebook\.com|fb\.com|fb\.watch)$/.test(host)) return "facebook";
  if(/(^|\.)tiktok\.com$/.test(host)) return "tiktok";
  if(/(^|\.)(douyin\.com|iesdouyin\.com)$/.test(host)) return "douyin";
  return "other";
}

function youtubeInfo(url){
  try{
    const u = new URL(url);
    let id = "";
    if(u.hostname.endsWith("youtu.be")) id = u.pathname.slice(1).split("/")[0];
    else if(u.searchParams.get("v")) id = u.searchParams.get("v");
    else {
      const m = u.pathname.match(/\/(shorts|embed|live)\/([\w-]{6,})/);
      if(m) id = m[2];
    }
    if(!/^[\w-]{6,}$/.test(id)) return null;
    return { id, tall: /\/shorts\//.test(u.pathname) };
  }catch(e){ return null; }
}

function embedHtml(url, platform){
  if(platform === "youtube"){
    const yt = youtubeInfo(url);
    if(!yt) return "";
    return `<div class="embed ${yt.tall ? "tall" : "wide"}"><iframe src="https://www.youtube.com/embed/${yt.id}" title="YouTube 影片" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
  }
  if(platform === "facebook"){
    const tall = /\/reel\/|\/share\/r\//.test(url);
    const src = "https://www.facebook.com/plugins/video.php?show_text=false&href=" + encodeURIComponent(url);
    return `<div class="embed ${tall ? "tall" : "wide"}"><iframe src="${esc(src)}" title="Facebook 影片" loading="lazy" allow="encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
  }
  if(platform === "tiktok"){
    const m = url.match(/\/video\/(\d+)/);
    if(!m) return "";
    return `<div class="embed tall"><iframe src="https://www.tiktok.com/embed/v2/${m[1]}" title="TikTok 影片" loading="lazy" allow="encrypted-media; fullscreen" allowfullscreen></iframe></div>`;
  }
  if(platform === "douyin"){
    const m = url.match(/\/video\/(\d+)/) || url.match(/[?&]modal_id=(\d+)/);
    if(!m) return "";
    return `<div class="embed tall"><iframe src="https://open.douyin.com/player/video?vid=${m[1]}&autoplay=0" title="抖音影片" loading="lazy" referrerpolicy="unsafe-url" allowfullscreen></iframe></div>`;
  }
  if(platform === "instagram"){
    return `<div id="igEmbedWrap"><blockquote class="instagram-media" data-instgrm-permalink="${esc(url)}" data-instgrm-version="14" style="margin:0 auto 12px; max-width:100%;"></blockquote></div>`;
  }
  return "";
}

function loadInstagramScript(){
  if(window.instgrm){
    window.instgrm.Embeds.process();
  } else if(!document.getElementById("igScript")){
    const script = document.createElement("script");
    script.id = "igScript";
    script.src = "https://www.instagram.com/embed.js";
    script.async = true;
    document.body.appendChild(script);
  }
}

function normalize(r){
  r.source = safeUrl(r.source);
  r.coverImage = safeUrl(r.coverImage);
  r.platform = r.source ? detectPlatform(r.source) : null;
  r.haystack = [r.name, r.category, r.preview, r.credit, r.ingredients.join(" "), r.steps.join(" ")]
    .join(" ").toLowerCase();
  return r;
}

function loadRecipes(){
  return fetch(CSV_URL)
    .then(res => { if(!res.ok) throw new Error("not public"); return res.text(); })
    .then(text => {
      const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
      const rows = parsed.data.map(row => ({
        id: (row["ID"] || "").trim(),
        name: (row["名稱"] || "").trim(),
        category: (row["分類"] || "").trim() || "未分類",
        preview: (row["一句話介紹"] || "").trim(),
        ingredients: (row["材料"] || "").split("|").map(s => s.trim()).filter(Boolean),
        steps: (row["步驟"] || "").split("|").map(s => s.trim()).filter(Boolean),
        source: (row["來源連結"] || "").trim(),
        credit: (row["出處"] || "").trim(),
        coverImage: (row["封面圖片網址"] || "").trim()
      })).filter(r => r.name);
      rows.forEach((r, i) => { if(!r.id) r.id = "row" + (i + 2); });
      // 試算表是往下新增，網站改成最新的排在最前面
      recipes = rows.length ? rows.reverse().map(normalize) : seedRecipes;
      document.getElementById("banner").classList.remove("show");
    })
    .catch(() => {
      recipes = seedRecipes;
      document.getElementById("banner").classList.add("show");
    })
    .finally(() => {
      renderAll();
      applyUrl();
    });
}

seedRecipes.forEach(normalize);
let recipes = seedRecipes;
let activeCat = "全部";
let query = "";

function categories(){
  const counts = new Map();
  recipes.forEach(r => counts.set(r.category, (counts.get(r.category) || 0) + 1));
  return [["全部", recipes.length], ...counts.entries()];
}

function filtered(){
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  return recipes.filter(r =>
    (activeCat === "全部" || r.category === activeCat) &&
    words.every(w => r.haystack.includes(w))
  );
}

function renderAll(){
  const cats = categories();
  if(activeCat !== "全部" && !cats.some(([c]) => c === activeCat)) activeCat = "全部";
  document.getElementById("count").textContent =
    `目前收藏 ${recipes.length} 道料理 · ${cats.length - 1} 個分類`;
  renderChips();
  renderGrid();
}

function renderChips(){
  const row = document.getElementById("chipRow");
  row.innerHTML = "";
  categories().forEach(([cat, n]) => {
    const chip = document.createElement("button");
    chip.className = "chip" + (cat === activeCat ? " active" : "");
    chip.innerHTML = `${esc(cat)}<span class="n">${n}</span>`;
    chip.onclick = () => { activeCat = cat; syncListUrl(); renderChips(); renderGrid(); };
    row.appendChild(chip);
  });
}

function renderGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const list = filtered();
  if(list.length === 0){
    grid.innerHTML = query
      ? `<div class="empty">找不到「${esc(query)}」相關的料理，換個關鍵字試試看。</div>`
      : '<div class="empty">這個分類還沒有食譜，點右上角「＋ 新增食譜」開始收藏吧。</div>';
    return;
  }
  list.forEach(r => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => openDetail(r.id);
    const pf = r.platform ? PLATFORMS[r.platform] : null;
    card.innerHTML = `
      ${r.coverImage
        ? `<div class="cover" style="background-image:url('${esc(cssUrl(r.coverImage))}')"><span class="play-badge">▶</span></div>`
        : `<div class="cover placeholder"><span class="ph-icon">🍲</span></div>`}
      <span class="cat">${esc(r.category)}</span>
      <h3>${esc(r.name)}</h3>
      <div class="prev">${esc(r.preview)}</div>
      ${r.source ? `<a class="watch-btn" href="${esc(r.source)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">觀看來源影片</a>` : ""}
      <div class="meta">
        <span class="pf pf-${r.platform || "self"}">${pf ? esc(pf.short) + (r.credit ? " · " + esc(r.credit) : "") : (r.credit ? esc(r.credit) : "自製食譜")}</span>
        <span>查看食譜 →</span>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ---------- 網址狀態：?r=食譜ID、?cat=分類、?q=關鍵字 ---------- */
function buildUrl(params){
  const u = new URL(SITE_URL);
  Object.entries(params).forEach(([k, v]) => { if(v) u.searchParams.set(k, v); });
  return u.toString();
}

function listParams(){
  return { cat: activeCat !== "全部" ? activeCat : "", q: query };
}

function syncListUrl(){
  const u = new URL(location.href);
  ["r","cat","q"].forEach(k => u.searchParams.delete(k));
  const p = listParams();
  if(p.cat) u.searchParams.set("cat", p.cat);
  if(p.q) u.searchParams.set("q", p.q);
  history.replaceState(null, "", u);
}

function applyUrl(){
  const u = new URL(location.href);
  activeCat = u.searchParams.get("cat") || "全部";
  query = u.searchParams.get("q") || "";
  document.getElementById("search").value = query;
  renderAll();
  const id = u.searchParams.get("r");
  if(id && recipes.some(x => x.id === id)) openDetail(id, true);
  else hideOverlay();
}

window.addEventListener("popstate", applyUrl);

/* ---------- 分享 ---------- */
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
  }
  return legacyCopy(text);
}

function legacyCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } finally { ta.remove(); }
  return Promise.resolve();
}

function shareLink(url, title, text){
  if(navigator.share){
    navigator.share({ title, text, url }).catch(() => {});
  } else {
    copyText(url).then(() => toast("連結已複製，可以貼給朋友了"));
  }
}

function lineUrl(url){
  return "https://social-plugins.line.me/lineit/share?url=" + encodeURIComponent(url);
}

function shareSite(){
  const p = listParams();
  const url = buildUrl(p);
  const title = p.cat ? `料理收容所｜${p.cat}` : "料理收容所";
  shareLink(url, title, p.cat ? `我收藏的「${p.cat}」料理，給你參考` : "我整理的做菜短影音食譜收藏，給你參考");
}

function shareRecipe(id){
  const r = recipes.find(x => x.id === id);
  if(!r) return;
  shareLink(buildUrl({ r: r.id }), `${r.name}｜料理收容所`, `這道「${r.name}」看起來很好做，給你參考`);
}

function copyRecipe(id){
  const r = recipes.find(x => x.id === id);
  if(!r) return;
  copyText(buildUrl({ r: r.id })).then(() => toast("食譜連結已複製"));
}

/* ---------- 食譜詳情 ---------- */
function openDetail(id, fromUrl){
  const r = recipes.find(x => x.id === id);
  if(!r) return;
  const pf = r.platform ? PLATFORMS[r.platform] : null;
  const shareUrl = buildUrl({ r: r.id });
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = `
    <button class="close" onclick="closeOverlay()" aria-label="關閉">×</button>
    <span class="cat">${esc(r.category)}</span>
    <h2>${esc(r.name)}</h2>
    <div class="src">${r.source ? `影片來源：${esc(pf.label)}${r.credit ? " · " + esc(r.credit) : ""}` : "自製食譜"}</div>
    <div class="share-row">
      <button type="button" onclick="shareRecipe('${esc(r.id)}')">分享這道菜</button>
      <a class="line" href="${esc(lineUrl(shareUrl))}" target="_blank" rel="noopener">傳到 LINE</a>
      <button type="button" onclick="copyRecipe('${esc(r.id)}')">複製連結</button>
    </div>
    ${r.source ? `
      ${embedHtml(r.source, r.platform)}
      <div><a class="watch-btn" href="${esc(r.source)}" target="_blank" rel="noopener" style="margin-top:2px;">在 ${esc(pf.label)} 開啟</a></div>
    ` : ""}
    ${r.ingredients.length ? `<h4>材料</h4><ul>${r.ingredients.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
    ${r.steps.length ? `<h4>步驟</h4><ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
  `;
  document.getElementById("overlay").classList.add("show");
  document.title = `${r.name}｜料理收容所`;
  if(!fromUrl){
    const u = new URL(location.href);
    u.searchParams.set("r", r.id);
    history.pushState({ r: r.id }, "", u);
  }
  if(r.platform === "instagram") loadInstagramScript();
}

function hideOverlay(){
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("sheet").innerHTML = "";
  document.title = "料理收容所｜電商神助手";
}

function closeOverlay(){
  const u = new URL(location.href);
  if(u.searchParams.has("r")){
    u.searchParams.delete("r");
    if(history.state && history.state.r) history.back();
    else { history.replaceState(null, "", u); hideOverlay(); }
  } else {
    hideOverlay();
  }
}

function openAddForm(){
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = `
    <button class="close" onclick="closeOverlay()" aria-label="關閉">×</button>
    <span class="cat">新增食譜</span>
    <h2>加入收藏</h2>
    <form id="addForm" onsubmit="return submitAdd(event)">
      <label>影片 / 貼文來源連結</label>
      <input name="source" type="url" placeholder="貼上 IG、FB、YouTube、TikTok 或抖音的影片連結" oninput="showPlatform(this.value)">
      <div class="hint" id="pfHint">支援 Instagram、Facebook、YouTube、TikTok、抖音，網站會自動判斷平台。</div>
      <label>料理名稱</label>
      <input name="name" required placeholder="例如：味噌奶油烏龍麵">
      <label>分類</label>
      <input name="category" required placeholder="例如：麵食／湯品／甜點" list="catList">
      <datalist id="catList">${categories().slice(1).map(([c])=>`<option value="${esc(c)}">`).join("")}</datalist>
      <label>一句話介紹（卡片預覽用）</label>
      <input name="preview" placeholder="這道菜的特色，一句話帶過">
      <label>封面圖片網址（選填，卡片縮圖用）</label>
      <input name="coverImage" placeholder="貼截圖或圖片的網址，留空則顯示分類色塊">
      <label>出處 / 作者</label>
      <input name="credit" placeholder="例如：Evan & Nic">
      <label>材料（每行一項）</label>
      <textarea name="ingredients" required placeholder="蘑菇 適量&#10;洋蔥 半個"></textarea>
      <label>步驟（每行一項）</label>
      <textarea name="steps" required placeholder="蘑菇炒至金黃色&#10;加入牛奶調味"></textarea>
      <div class="hint" id="submitHint">送出後會直接寫入 Google Sheet，網站也會同步更新。也可以<a href="${SHEET_EDIT_URL}" target="_blank" rel="noopener" style="color:var(--miso-deep); font-weight:700;">直接到 Sheet 編輯</a>。</div>
      <button class="submit" type="submit" id="submitBtn">儲存食譜</button>
    </form>
  `;
  document.getElementById("overlay").classList.add("show");
}

function showPlatform(v){
  const hint = document.getElementById("pfHint");
  const pf = safeUrl(v) ? detectPlatform(v.trim()) : null;
  hint.textContent = pf && pf !== "other"
    ? `✓ 偵測到 ${PLATFORMS[pf].label} 影片`
    : "支援 Instagram、Facebook、YouTube、TikTok、抖音，網站會自動判斷平台。";
}

function submitAdd(e){
  e.preventDefault();
  const f = e.target;
  const btn = document.getElementById("submitBtn");
  const hint = document.getElementById("submitHint");

  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_") === 0){
    hint.innerHTML = `⚠ 尚未設定寫入連結，請先完成 Apps Script 部署，或<a href="${SHEET_EDIT_URL}" target="_blank" rel="noopener" style="color:#a86a26; font-weight:700;">直接到 Sheet 手動新增</a>。`;
    hint.style.color = "#a86a26";
    return false;
  }

  const ingredients = f.ingredients.value.split("\n").map(s => s.trim()).filter(Boolean);
  const steps = f.steps.value.split("\n").map(s => s.trim()).filter(Boolean);
  const name = f.name.value.trim();
  const category = f.category.value.trim() || "未分類";
  const preview = f.preview.value.trim();
  const source = f.source.value.trim();
  const coverImage = f.coverImage.value.trim();
  const credit = f.credit.value.trim();

  const fd = new FormData();
  fd.append("name", name);
  fd.append("category", category);
  fd.append("preview", preview);
  fd.append("source", source);
  fd.append("coverImage", coverImage);
  fd.append("credit", credit);
  fd.append("ingredients", ingredients.join(" | "));
  fd.append("steps", steps.join(" | "));

  btn.textContent = "儲存中...";
  btn.disabled = true;

  fetch(APPS_SCRIPT_URL, { method: "POST", mode: "no-cors", body: fd })
    .then(() => {
      recipes.unshift(normalize({ id: "temp" + Date.now(), name, category, preview, source, coverImage, credit, ingredients, steps }));
      hideOverlay();
      renderAll();
      toast("已收藏！");
      setTimeout(loadRecipes, 3000);
    })
    .catch(() => {
      hint.textContent = "送出失敗，請檢查網路連線，或到 Sheet 手動新增。";
      hint.style.color = "#c0392b";
      btn.textContent = "儲存食譜";
      btn.disabled = false;
    });

  return false;
}

let searchTimer;
document.getElementById("search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    query = e.target.value.trim();
    syncListUrl();
    renderGrid();
  }, 150);
});

document.getElementById("overlay").addEventListener("click", (e) => {
  if(e.target.id === "overlay") closeOverlay();
});

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && document.getElementById("overlay").classList.contains("show")) closeOverlay();
});

renderAll();
loadRecipes();
</script>
</body>
</html>
